name: Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Package Windows x64
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: target
      CARGO_PROFILE_RELEASE_LTO: 'true'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      CARGO_PROFILE_RELEASE_STRIP: symbols
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build native desktop launcher
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin nsh-app-pomoterra
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }

      - name: Verify PE headers and create distributable ZIP
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-WindowsExecutable([string] $Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "Not a Windows executable (missing MZ header): $Path"
            }
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($pe -lt 64 -or $pe -gt ($bytes.Length - 94)) {
              throw "Invalid PE header offset: $Path"
            }
            if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x00004550) {
              throw "Missing PE signature: $Path"
            }
            if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) {
              throw "Executable is not AMD64: $Path"
            }
            if ([BitConverter]::ToUInt16($bytes, $pe + 24) -ne 0x020B) {
              throw "Executable is not PE32+: $Path"
            }
            if ([BitConverter]::ToUInt16($bytes, $pe + 24 + 68) -ne 2) {
              throw "Executable is not a Windows GUI application: $Path"
            }
            Write-Host "Verified AMD64 PE32+ Windows GUI executable: $Path ($($bytes.Length) bytes)"
          }

          $source = Join-Path $PWD 'target/x86_64-pc-windows-msvc/release/nsh-app-pomoterra.exe'
          Assert-WindowsExecutable $source

          $stage = Join-Path $PWD 'dist/pomoterra-windows-x64'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $source (Join-Path $stage 'pomoterra.exe')
          Copy-Item 'THIRD_PARTY_NOTICES.md' $stage
          $zip = Join-Path $PWD 'dist/pomoterra-windows-x64.zip'
          Compress-Archive -Path $stage -DestinationPath $zip -Force

          # Check the executable actually shipped in the ZIP, not just the build output.
          $verify = Join-Path $env:RUNNER_TEMP 'pomoterra-package-verification'
          Expand-Archive -Path $zip -DestinationPath $verify -Force
          $packaged = Join-Path $verify 'pomoterra-windows-x64/pomoterra.exe'
          Assert-WindowsExecutable $packaged
          if ((Get-FileHash $source).Hash -ne (Get-FileHash $packaged).Hash) {
            throw 'Packaged executable differs from the verified build output'
          }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  pomoterra-windows-x64.zip" | Set-Content -Encoding ascii "$zip.sha256"
          @"
          ## Windows x64 package
          - Target: x86_64-pc-windows-msvc
          - Executable: $((Get-Item $source).Length) bytes
          - ZIP: $((Get-Item $zip).Length) bytes
          - SHA-256: $hash
          - Verified: MZ, PE signature, AMD64, PE32+, GUI subsystem, archived executable hash
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: pomoterra-windows-x64
          path: |
            dist/pomoterra-windows-x64.zip
            dist/pomoterra-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release tags must use stable semantic versioning: vMAJOR.MINOR.PATCH'
          }
          gh release view "$env:RELEASE_TAG" --json tagName
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --verify-tag --title "Pomoterra $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Creating GitHub Release failed' }
          }
          gh release upload "$env:RELEASE_TAG" dist/pomoterra-windows-x64.zip dist/pomoterra-windows-x64.zip.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading release assets failed' }
