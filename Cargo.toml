[package]
name = "nsh-app-pomoterra"
version = "0.1.2"
edition = "2024"
publish = false

[workspace]

[features]
default = ["native"]
native = ["dep:nsh-platform-linux", "dep:nsh-platform-macos", "dep:nsh-platform-windows", "dep:ksni", "dep:fontdue", "dep:tray-icon", "dep:dispatch2", "dep:windows"]
gpui = ["dep:nsh-platform-gpui"]

[dependencies]
nsh-core = { version = "0.4.0", features = ["svg"] }
nsh-base = "0.4.0"
env_logger = "0.11"
chrono = "0.4"
toasty = { version = "0.11", default-features = false }
toasty-driver-sqlite = "0.11"
tokio = { version = "1", features = ["rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
lucide-icons = "=1.70.0"

[build-dependencies]
lucide-icons = "=1.70.0"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false, optional = true }
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"], optional = true }
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
fontdue = { version = "0.9", optional = true }
nsh-platform-gpui = { version = "=0.4.0", default-features = false, features = ["runtime-shaders"], optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false, optional = true }
dispatch2 = { version = "0.3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false, optional = true }
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_System_Threading"] }
