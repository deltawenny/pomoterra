[package]
name = "nsh-app-pomoterra"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = { version = "0.4.0", features = ["svg"] }
nsh-base = "0.4.0"
env_logger = "0.11"
chrono = "0.4"
toasty = { version = "0.11", default-features = false }
toasty-driver-sqlite = "0.11"
tokio = { version = "1", features = ["rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
lucide-icons = "=1.70.0"

[build-dependencies]
lucide-icons = "=1.70.0"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
fontdue = "0.9"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }
dispatch2 = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_System_Threading"] }
